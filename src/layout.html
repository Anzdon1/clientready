<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site_url}}/assets/logo/avatar.png">
<meta name="theme-color" content="#F8ECD9">
<link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/logo/favicons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/logo/favicons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/logo/favicons/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/site.css?v={{asset_v}}">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ga_id}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ga_id}}');
</script>
</head>
<body class="{{body_class}}" data-page="{{page_key}}">
<a class="skip" href="#main">Skip to content</a>
{{partial_nav}}
<main id="main">
{{content}}
</main>
{{partial_footer}}
<script src="/assets/site.js?v={{asset_v}}" defer></script>
</body>
</html>
